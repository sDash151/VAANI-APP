# ─── MODEL & EXECUTION ─────────────────────────────────────
model_path: "models/isl_video_best.pt"
execution_provider: "auto"
sequence_length: 160           # Each video preprocessed to 160 frames
sequence_overlap: 5
frame_width: 640
frame_height: 480
max_video_size: 52428800       # 50MB
input_size: 1662               # From trained model
num_classes: 41
gpu_threshold: 0.8
log_level: "INFO"

# ─── DATA PATHS ─────────────────────────────────────────────
train_data_path: "E:/ALL PROJECTS/FINAL_YEAR_PROJECT_BACKUP/ASSETS/ISL_PROCESSED_VIDEO_SPLIT/train"
val_data_path: "E:/ALL PROJECTS/FINAL_YEAR_PROJECT_BACKUP/ASSETS/ISL_PROCESSED_VIDEO_SPLIT/val"

# ─── TRAINING HYPERPARAMETERS ──────────────────────────────
batch_size: 32
epochs: 50
learning_rate: 0.0001
hidden_dim: 128
dropout_p: 0.3
seed: 42

# ─── PATHS FOR CHECKPOINTS, LOGGING, EXPORT ────────────────
checkpoint_dir: "checkpoints"
model_save_path: "models/isl_video_best.pt"
torchscript_path: "models/isl_video_best.pt.ts"
tensorboard: true
tensorboard_log_dir: "logs/tensorboard"
log_dir: "logs"


