name: bswl_frontend_app
description: Sign Language Learning App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0

  ## ── Firebase core & Auth ─────────────────────────────────────────────────
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  ## ── Google Sign-In ───────────────────────────────────────────────────────
  google_sign_in: ^7.1.1

  ## ── Internationalization / Date formatting ──────────────────────────────
  intl: ^0.20.2

  ## ── UI & Icons ───────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.7
  percent_indicator: ^4.2.2

  ## ── State Management ────────────────────────────────────────────────────
  provider: ^6.0.5

  ## ── Camera & ML ─────────────────────────────────────────────────────────
  camera: ^0.11.2
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3

  ## ── Networking ──────────────────────────────────────────────────────────
  http: ^1.2.0
  google_generative_ai: ^0.3.0

  ## ── Animations & Effects ─────────────────────────────────────────────────
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.1.1

  ## ── Caching & Vibration ─────────────────────────────────────────────────
  cached_network_image: ^3.3.0
  vibration: ^3.1.3
  path_provider: ^2.1.2

  ## ── Video Player ─────────────────────────────────────────────────────────
  video_player: ^2.8.1
  chewie: ^1.7.4
  wakelock_plus: ^1.1.4

  ## ── Icons ─────────────────────────────────────────────────────────────────
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.5.3
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/images/
    - assets/fonts/
    - assets/models/
    - assets/animations/namaste.json
    - assets/animations/thankyou.json
    - assets/animations/hello.json
    - assets/animations/BOY1.json
    - assets/animations/BOY2.json
    - assets/animations/GIRL.json
    - assets/animations/student.json
    - assets/models/palm_detection_lite.tflite
    - assets/models/hand_landmark_lite.tflite
    # Video Assets - Copy from root ASSETS folder to assets/video_modules/
    - assets/video_modules/
    - assets/video_modules/Elementary/
    - assets/video_modules/Elementary/Alphabets/
    - assets/video_modules/Elementary/Greetings/
    - assets/video_modules/Elementary/Numbers/
    - assets/video_modules/Elementary/Days/
    - assets/video_modules/Elementary/Months/
    - assets/video_modules/Elementary/Colours/
    - assets/video_modules/Elementary/Fruits/
    - assets/video_modules/Elementary/Vegetables/
    - assets/video_modules/Elementary/Action Words/
    - assets/video_modules/Elementary/Animals/
    - assets/video_modules/Elementary/Common Birds/
    - assets/video_modules/Elementary/Family/
    - assets/video_modules/Elementary/Food and Beverages/
    - assets/video_modules/Elementary/India/
    - assets/video_modules/Elementary/Common Wears/
    - assets/video_modules/Elementary/Emotions/
    - assets/video_modules/Intermediate/
    - assets/video_modules/Intermediate/English Grammar/
    - assets/video_modules/Intermediate/Question Words/
    - assets/video_modules/Intermediate/Parts Of Speech/
    - assets/video_modules/Intermediate/Noun/
    - assets/video_modules/Intermediate/Pronoun/
    - assets/video_modules/Intermediate/Adjectives/
    - assets/video_modules/Intermediate/Verb/
    - assets/video_modules/Intermediate/Adverb/
    - assets/video_modules/Intermediate/Preposition/
    - assets/video_modules/Intermediate/Idioms/
    - assets/video_modules/Intermediate/Phrasal Verbs/
    - assets/video_modules/Intermediate/Interjections/
    - assets/video_modules/Intermediate/Conjunctions/
    - assets/video_modules/Intermediate/Making Sentence/
    - assets/video_modules/Conversation/
    - assets/video_modules/Morals/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500